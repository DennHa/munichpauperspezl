# Uploads the site to the Hetzner webhosting via FTPS on every push to main.
# Uses lftp because Hetzner's FTP server requires TLS session reuse on the
# data connection, which FTP-Deploy-Action doesn't support (error 425).
# The FTP user lands directly in the website folder, so files go to ./
# Nothing is deleted on the server; files are only added or overwritten.
# Credentials live in the repo's GitHub Secrets:
#   FTP_SERVER    e.g. www746.your-server.de
#   FTP_USERNAME
#   FTP_PASSWORD

name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME" --env-password "ftp://$FTP_SERVER" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 --no-perms \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .gitignore \
            --exclude-glob .vscode/ \
            --exclude-glob .DS_Store \
            --exclude-glob _old/ \
            --exclude-glob assets/sass/ \
            --exclude-glob *.pdf \
            --exclude-glob README.txt \
            --exclude-glob LICENSE.txt \
            --exclude-glob CNAME \
            ./ ./
          bye
          EOF
